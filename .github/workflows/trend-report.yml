name: trend-report

on:
  schedule:
    - cron: "30 11 * * *"   # 매일 11:30 UTC = 한국 20:30 (발송일 판단은 run_and_notify.py가 함)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "미리보기만 (가족방에 보내지 않음)"
        type: boolean
        default: true
      force:
        description: "일정 무시하고 지금 발송 (dry_run 해제 시)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: trend-report

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Seoul
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 갱신 + 텔레그램 발송 (3·4·6·7)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          LOCALDATA_API_KEY: ${{ secrets.LOCALDATA_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -I -X utf8 run_and_notify.py --only 3,4,6,6+,7 --label GitHub ${{ inputs.force && '--force' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: 스냅샷 저장 (다음 회차 비교용)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "data: $(date +%F) 스냅샷"
          git push
