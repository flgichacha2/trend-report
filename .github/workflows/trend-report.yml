name: trend-report

on:
  schedule:
    - cron: "30 11 * * *"   # 매일 11:30 UTC = 한국 20:30 (발송일 판단은 run_and_notify.py가 함)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "미리보기만 (가족방에 보내지 않음)"
        type: boolean
        default: true
      force:
        description: "일정 무시하고 지금 발송 (dry_run 해제 시)"
        type: boolean
        default: false
      test_email:
        description: "시험 메일만 보내기 (다른 작업 안 함)"
        type: boolean
        default: false
      only:
        description: "실행할 항목 (쉼표 구분, 비우면 기본값)"
        type: string
        default: ""

permissions:
  contents: write

concurrency: trend-report

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Seoul
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 갱신 + 텔레그램 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          LOCALDATA_API_KEY: ${{ secrets.LOCALDATA_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: |
          if [ "${{ inputs.test_email }}" = "true" ]; then python -I -X utf8 tools/test_email.py; exit $?; fi
          python -I -X utf8 run_and_notify.py --only ${{ inputs.only || '3,4,6,6+,7,8,10,13' }} --label GitHub ${{ inputs.force && '--force' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: 스냅샷 저장 (다음 회차 비교용)
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 이번 실행이 만든 결과(스냅샷·빌라 데이터·발송기록)만 따로 보관
          tmp=$(mktemp -d)
          git ls-files -mo --exclude-standard -z             | grep -zE '/data/snapshots/|^06_[^/]+/data/(villa_|raw/villa/)|^logs/sent_'             | xargs -0 -r cp --parents -t "$tmp"
          # 최신 저장소 위에 결과만 덮어써서 저장 (코드 변경과 충돌하지 않음)
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp -a "$tmp"/. .
            git add -A
            if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
            git commit -qm "data: $(date +%F) 스냅샷"
            if git push -q origin HEAD:main; then echo "저장 완료"; exit 0; fi
            sleep 5
          done
          echo "저장 실패"; exit 1
